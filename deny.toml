# cargo-deny config. See hooks/audit-cargo-deps.sh and the "Supply chain
# security" section of README.md.
#
# Only the advisories, bans and sources checks are used here (license
# compliance is out of scope for this policy), so this file has no
# [licenses] section. Always invoke as:
#
#   cargo deny check advisories bans sources
#
# not bare `cargo deny check`, which would also run the licenses check
# against a config that has no license policy defined for it.

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# "warn" not "deny": chacha20 0.10.1 is yanked but the replacement
# is blocked by cooldown. Tighten back after `cargo update -p chacha20`.
yanked = "warn"
ignore = [
    # rustls < 0.23.45: fix published 2026-09-14, blocked by cooldown
    # 7-day gate until 2026-09-21. Remove after lockfile >= 0.23.45.
    "RUSTSEC-2026-0285",
    # h2 unbounded empty DATA frames. Transitive dep of matrix-sdk
    # and reqwest; no update available in our pinned versions yet.
    "RUSTSEC-2026-0258",
    # bitmaps: unmaintained. Transitive dep, no drop-in replacement.
    "RUSTSEC-2026-0247",
    # proc-macro-error2: unmaintained. Transitive dep of matrix-sdk.
    "RUSTSEC-2026-0173",
    # rustls-pemfile: unmaintained (merged into rustls crate).
    # Transitive dep; awaiting upstream to drop it.
    "RUSTSEC-2025-0134",
    # imbl-sized-chunks double-free on Drop panic. Fix is 0.2.0, but
    # imbl 6.1.0 pins ^0.1.3; needs imbl 7.x, blocked by matrix-sdk.
    "RUSTSEC-2026-0292",
]

[bans]
multiple-versions = "warn"
# "warn" not "deny": transitive deps with version = "*" fire this. The
# offending crate(s) are upstream, not ours. Tighten to "deny" once
# cargo-deny output identifies them and skip entries are added.
wildcards = "warn"

# Known-bad packages/versions. Add to this list the moment a new supply-chain
# report names specific package/version IOCs, even before RustSec publishes
# a formal advisory for them: this list is what stands between a `cargo
# cooldown update` and pulling one in.
#
# Seeded 2026-08-28 from the arrayref@0.3.10 compromise (Wiz writeup,
# https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns,
# compromise dated 2026-08-20): three hijacked crates pinned to their
# malicious version, plus six attacker-created typosquats banned at any
# version since they have no legitimate release to allow.
deny = [
    { crate = "arrayref@0.3.10", reason = "hijacked release, build-script backdoor (Wiz, 2026-08-20)" },
    { crate = "internment@0.8.7", reason = "hijacked release, build-script backdoor (Wiz, 2026-08-20)" },
    { crate = "append-only-vec@0.1.9", reason = "hijacked release, build-script backdoor (Wiz, 2026-08-20)" },
    { crate = "proc-macro1", reason = "typosquat of proc-macro2, attacker-created (Wiz, 2026-08-20)" },
    { crate = "proc-macro-en", reason = "attacker-created typosquat (Wiz, 2026-08-20)" },
    { crate = "aovine", reason = "attacker-created typosquat (Wiz, 2026-08-20)" },
    { crate = "arone", reason = "attacker-created typosquat (Wiz, 2026-08-20)" },
    { crate = "aronenao", reason = "attacker-created typosquat (Wiz, 2026-08-20)" },
    { crate = "tinymember", reason = "attacker-created typosquat (Wiz, 2026-08-20)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
