# Telegram. Adds one secret to the daemon and nothing else: Telegram is reached
# over plain HTTPS long-polling, so there is no sidecar to run.
#
#   docker compose -f docker-compose.yml -f compose/docker-compose.telegram.yml up -d
#
# Needs `[telegram]` in adapters.toml and TELEGRAM_TOKEN in .env.

services:
  party-line-pagerd:
    environment:
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN:-}"
