# The Reticulum party line provider. Load this only if policy.toml has a
# [provider.rns] section.
#
# Needs the Docker socket, which is granted once in
# compose/docker-compose.docker-socket.yml. Load that alongside this file:
#
#   docker compose -f docker-compose.yml -f compose/docker-compose.docker-socket.yml \
#                  -f compose/docker-compose.rns.yml up -d
#
# Separate files because compose concatenates group_add and then rejects a list
# with two equal entries, so two party lines could not each grant the group.
#
# Reticulum is NOT onion routing. The reflector this brings up sees every
# caller's IP address, and its destination hash is announced across the
# network. It is the right choice when reaching each other without port
# forwarding is the point, and the wrong one when anonymity is: use
# [provider.tor] or [provider.i2p] for that.
#
# Reachability also rides on public transport nodes run by volunteers (RNS_HUBS
# in party-lines/reticulum-party-line/rns-party-line.sh). Nothing has to be forwarded
# or opened, but the route is somebody else's infrastructure.
#
# Defaults to transports/reticulum-party-line/ (published image, no checkout
# needed). To use a local git checkout instead, set RETICULUM_PARTYLINE_DIR
# in .env:
#   RETICULUM_PARTYLINE_DIR=${PWD}/party-lines/reticulum-party-line
# and clone the repo:
#   git clone https://gitlab.com/MarcusHoltz/reticulum-party-line.git party-lines/reticulum-party-line

services:
  partylinepagerd:
    environment:
      # Its own variable, not TOR_PARTYLINE_DIR. See compose/docker-compose.i2p.yml.
      RETICULUM_PARTYLINE_DIR: "${RETICULUM_PARTYLINE_DIR:-${PWD}/transports/reticulum-party-line}"
    volumes:
      # The transport directory the hooks operate on. The path must be
      # identical inside and outside the container, because compose resolves
      # relative bind mounts against the host filesystem.
      - "${RETICULUM_PARTYLINE_DIR:-${PWD}/transports/reticulum-party-line}:${RETICULUM_PARTYLINE_DIR:-${PWD}/transports/reticulum-party-line}"
