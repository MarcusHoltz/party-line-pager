[package]
name = "party-line-pagerd"
description = "The PartyLinePager daemon: chat adapters, policy enforcement, room provisioning, fanout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
party-line-pager-core.workspace = true
anyhow.workspace = true
async-trait = "0.1"
chrono.workspace = true
clap.workspace = true
data-encoding.workspace = true
humantime-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
futures-util = "0.3"
mailparse = "0.16"
# Signal receive: signal-cli-rest-api's MODE=json-rpc (the recommended mode)
# serves /v1/receive as a websocket, not a plain GET. See adapters/signal.rs.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Protocols complex enough to deserve a library. Telegram, Mastodon and Signal
# are plain REST and use reqwest directly.
irc = { version = "1", default-features = false, features = ["tls-rust"] }
# "insecure-tcp" is what `[xmpp] tls = false` needs. It exists for the throwaway
# server the live tests run against, which has no certificate to verify.
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "insecure-tcp", "ring", "webpki-roots", "dns"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls",
    "smtp-transport",
    "builder",
    "ring",
    "webpki-roots",
] }
matrix-sdk = { version = "0.19", default-features = false, features = [
    "e2e-encryption",
    "bundled-sqlite",
] }
# Discord inbound is gateway websocket only, there is no polling API, so it
# cannot be hand-rolled on reqwest the way Telegram, Mastodon and Signal are.
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"

[dev-dependencies]
tempfile = "3"
