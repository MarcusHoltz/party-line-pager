groups:
  - name: PartylinePager Configuration
    description: Configure PartylinePager
  - name: Network Configuration
    description: Configure network for PartylinePager
  - name: Storage Configuration
    description: Configure storage for PartylinePager
  - name: Resources Configuration
    description: Configure resources for PartylinePager

questions:
  - variable: partylinepager
    label: ""
    group: PartylinePager Configuration
    schema:
      type: dict
      attrs:
        - variable: providers
          label: Providers
          description: "Comma-separated transports to enable: tor, i2p, rns, web"
          schema:
            type: string
            default: "tor,web"
        - variable: auto_start
          label: Auto Start
          description: Start daemon automatically on container boot
          schema:
            type: boolean
            default: false
        - variable: headless
          label: Headless Mode
          description: Daemon-only mode with no web terminal
          schema:
            type: boolean
            default: false
        - variable: web_base_url
          label: Web Base URL
          description: Video call instance URL for web rooms
          schema:
            type: string
            default: "https://p2p.mirotalk.com"
        - variable: ttyd_credential
          label: Terminal Credential
          description: "Basic auth for web terminal (user:password)"
          schema:
            type: string
            default: ""
            private: true
        - variable: additional_envs
          label: Additional Environment Variables
          description: Configure additional environment variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
                        required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web Terminal Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on host
                    - value: "exposed"
                      description: Expose port to other containers
                    - value: ""
                      description: Disabled
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 7681
                  min: 1
                  max: 65535
                  show_if: [["bind_mode", "=", "published"]]

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: config
          label: Config Storage
          description: Config, state, and secrets directory
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: "ix_volume"
                  enum:
                    - value: "ix_volume"
                      description: ixVolume (dataset managed by TrueNAS)
                    - value: "host_path"
                      description: Host Path (pre-existing directory)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: "config"
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Resource Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPU
                schema:
                  type: int
                  default: 2
                  min: 1
              - variable: memory
                label: Memory (MB)
                schema:
                  type: int
                  default: 4096
                  min: 512
